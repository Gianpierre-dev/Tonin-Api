spring.application.name=Tonin-Api

# Perfil activo: default = prod (más seguro si la env var no propaga).
# En desarrollo local se setea explícitamente con SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Puerto: Railway (u otro PaaS) inyecta PORT dinamicamente; en local cae a 8080
server.port=${PORT:8080}

# Suprime el header "Server: ..." de Tomcat (reduce reconocimiento del stack)
server.server-header=

# Confiar en los X-Forwarded-* del proxy de Railway (TLS termina en su edge).
# Necesario para que Spring Security detecte HTTPS y emita el header HSTS.
server.forward-headers-strategy=framework

# --- BASE DE DATOS ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tonindb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE ---
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Default seguro: el perfil dev sobreescribe a "update" para desarrollo local
spring.jpa.hibernate.ddl-auto=validate

# --- JWT --- (la variable JWT_SECRET es OBLIGATORIA; sin fallback intencionalmente)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4321}

# --- WASABI / S3 ---
wasabi.access-key=${WASABI_ACCESS_KEY}
wasabi.secret-key=${WASABI_SECRET_KEY}
wasabi.bucket-name=${WASABI_BUCKET_NAME:sunat-consultas}
wasabi.region=${WASABI_REGION:us-west-1}
wasabi.endpoint=${WASABI_ENDPOINT:https://s3.us-west-1.wasabisys.com}
wasabi.folder=${WASABI_FOLDER:tonin-api}

# --- UPLOAD ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- SWAGGER ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- I18N ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
